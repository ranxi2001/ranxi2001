name: Update GitHub stats

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-github-stats.yml'

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate stats SVG
        uses: stats-organization/github-readme-stats-action@abb8761d64babb580b336af88cccb2db39063440
        with:
          card: stats
          options: username=ranxi2001&show_icons=true&hide_title=true&text_color=6F90B5
          path: assets/github-stats.svg
          core_version: '2.1.3'
          fail_on_error: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated card
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/github-stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: update GitHub stats card'
          git pull --rebase origin main
          git push origin HEAD:main
