name: Update GitHub stats

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-github-stats.yml'
      - '.github/scripts/generate-stats.mjs'

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Install pinned open-source renderer
        run: npm install --prefix "$RUNNER_TEMP/onefly-stats" --ignore-scripts --no-audit --no-fund @stats-organization/github-readme-stats-core@2.1.3
      - name: Generate stats SVG
        run: node .github/scripts/generate-stats.mjs "$RUNNER_TEMP/onefly-stats"
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated card
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/github-stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: update GitHub stats card'
          git pull --rebase origin main
          git push origin HEAD:main
